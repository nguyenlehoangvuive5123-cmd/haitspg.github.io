            <h1>CONCEPT ARTWORKS</h1>

            <div class="gallery-grid">
                <div class="art-item" data-title="Ash (2023-2025)"
                    data-desc="Artworks of an original character: a female Korean Parkourer named Ash.
                    The design is not yet finalized. Multiple design changes were made to better fit the character's profession as a parkour artist/traceuse but also maintain her distinctive characteristics (the sunhat & band logo)"
                    data-gallery='[
                "images/Concept/CharacterDesign_Ash.PNG", "images/Concept/CharacterDesign_Ash_1.png", "images/Concept/CharacterDesign_Ash_2.png", "images/Concept/CharacterDesign_Ash_Alt.PNG"]'>
                    <img src="images/Concept/CharacterDesign_Ash.PNG" alt="Original character: Ash">
                    <h3>Ash (2023-2025)</h3>
                </div>

                <div class="art-item" data-title="Hikaru Ishioka (2025)"
                    data-desc="Artworks of an original character: a male Japanese highschool student named Ishioka Hikaru.
                    There are 2 designs for the character: School uniform and a film director/detective inspired wear, which has not been drawn/sketched out.
                    The character is heavily inspired by old media like tape players and film rolls, and a popular manga: 'Toilet-bound Hanako Kun' and follows the same concepts & power system."
                    data-gallery='[
                "images/Concept/CharacterDesign_Hikaru_Overview_2.PNG", "images/Concept/CharacterDesign_Hikaru_Overview_1.PNG", "images/Concept/CharacterDesign_Hikaru_1.PNG", "images/Concept/CharacterDesign_Hikaru_2.PNG"
                ]'>
                    <img src="images/Concept/CharacterDesign_Hikaru_Overview_2.png" alt="Original character: Hikaru">
                    <h3>Hikaru Ishioka (2025)</h3>
                </div>
                <div class="art-item" data-title="Sciainno (2024)"
                    data-desc="Character Designs, Concept Art and Cover Art consisting of male and female mascots of a Science/STEM Awareness Project named Sciainno.
                    These character designs are the first professional original work I have done. The designs follow the theme of cyberpunk, the process was partially documented going from the early periods of idea sketching to fleshing out the characters themselves.
                    I did my best to keep the designs simple but also add distinctive features to make the characters unique but also realistic (in a way)."
                    data-gallery='[
          "images/Concept/PostCover_FINAL.jpeg", "images/Concept/CharacterDesign_Sciainno_Male_FINAL.jpeg", "images/Concept/CharacterDesign_Sciainno_Female_FINAL.jpeg", "images/Concept/CharacterDesign_Sciainno_Male_1.png", 
          "images/Concept/CharacterDesign_Sciainno_Female_1.png", "images/Concept/CharacterDesign_Sciainno_Male_2.png", "images/Concept/CharacterDesign_Sciainno_Male_3.png", "images/Concept/PostCover_1.png",
          "images/Concept/PostCover_2.png", "images/Concept/PostCover_3.png"
        ]'>
                    <img src="images/Concept/PostCover_FINAL.jpeg" alt="Sciainno Artwork">
                    <h3>Sciainno (2024)</h3>
                </div>
            </div>
